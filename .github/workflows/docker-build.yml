name: update docker image

on:
  push:
    branches:
      - dev
      - master
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: set docker image tag
        id: meta
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "IMAGE_TAG=dev" >> "$GITHUB_ENV"
            echo "CREATE_IMAGE=true" >> "$GITHUB_ENV"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "IMAGE_TAG=${{ github.ref_name }}" >> "$GITHUB_ENV"
            echo "CREATE_IMAGE=true" >> "$GITHUB_ENV"
          elif [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "IMAGE_TAG=latest" >> "$GITHUB_ENV"
            echo "CREATE_IMAGE=true" >> "$GITHUB_ENV"
          else
            echo "CREATE_IMAGE=false" >> "$GITHUB_ENV"
          fi

          # Tidrax deploys the portal/RDGen images via scripts/deploy-*-image.sh
          # (docker load on the Portainer host). Docker Hub push is optional —
          # skip cleanly when credentials are not configured instead of failing
          # every push to master.
          if [ -n "${{ vars.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "DOCKERHUB_READY=true" >> "$GITHUB_ENV"
          else
            echo "DOCKERHUB_READY=false" >> "$GITHUB_ENV"
            echo "::warning::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN missing — skipping Docker Hub push (local deploy scripts still work)."
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        if: env.CREATE_IMAGE == 'true' && env.DOCKERHUB_READY == 'true'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        if: env.CREATE_IMAGE == 'true' && env.DOCKERHUB_READY == 'true'

      - name: Build and push
        uses: docker/build-push-action@v7
        if: env.CREATE_IMAGE == 'true' && env.DOCKERHUB_READY == 'true'
        with:
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:${{ env.IMAGE_TAG }}
